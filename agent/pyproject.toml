[project]
name = "flowboard-agent"
version = "1.2.12"
description = "Flowboard local agent: FastAPI + SQLite + extension bridge"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pillow>=10.0",
    # Video-to-shotlist analyzer. Headless OpenCV on purpose — the server has
    # no display, and scenedetect's own `opencv-python` requirement is neutered
    # below so the two never both install into site-packages/cv2.
    "opencv-python-headless>=4.9",
    "scenedetect>=0.6.4",
    # Imported ONLY inside the ASR subprocess (services/video_analyzer/asr_worker).
    # It pulls PyAV, whose bundled libavdevice clashes with OpenCV's copy when
    # both load into one process on macOS.
    "faster-whisper>=1.1",
]

[tool.uv]
# scenedetect hard-depends on the GUI `opencv-python`; we ship the headless
# build. A marker that never matches removes the requirement instead of letting
# two packages fight over the same cv2 directory.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowboard"]

[tool.ruff]
line-length = 100
target-version = "py310"
